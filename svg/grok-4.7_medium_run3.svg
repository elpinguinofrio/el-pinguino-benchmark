<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="title desc">
  <title>Penguin in a sombrero riding an e-foil</title>
  <desc>A penguin in a wide straw sombrero crouches on an electric hydrofoil board, skimming above sunset water while the mast, wing, and propeller run below the surface.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f6d7a4"/>
      <stop offset="45%" stop-color="#f09466"/>
      <stop offset="78%" stop-color="#5aa0c4"/>
      <stop offset="100%" stop-color="#3e86ad"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a86a3"/>
      <stop offset="38%" stop-color="#0e6480"/>
      <stop offset="100%" stop-color="#062f42"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3d27a"/>
      <stop offset="55%" stop-color="#e2a43f"/>
      <stop offset="100%" stop-color="#c4842c"/>
    </linearGradient>
    <linearGradient id="crown" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6dc8e"/>
      <stop offset="42%" stop-color="#e0a445"/>
      <stop offset="100%" stop-color="#b87528"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f4ee"/>
      <stop offset="46%" stop-color="#efe8dc"/>
      <stop offset="47%" stop-color="#1c8f86"/>
      <stop offset="100%" stop-color="#0e5e5c"/>
    </linearGradient>
    <linearGradient id="belly" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fffaf2"/>
      <stop offset="100%" stop-color="#e7dfd0"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f4f7f8"/>
      <stop offset="45%" stop-color="#c5ced6"/>
      <stop offset="100%" stop-color="#7d8b98"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff4d2"/>
      <stop offset="55%" stop-color="#ffd27a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#ffb15a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="weave" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(-16)">
      <line x1="0" y1="10" x2="10" y2="0" stroke="#a8742c" stroke-width="0.7" opacity="0.4"/>
    </pattern>
    <clipPath id="below">
      <rect x="0" y="408" width="960" height="232"/>
    </clipPath>
    <clipPath id="above">
      <rect x="0" y="0" width="960" height="408"/>
    </clipPath>
  </defs>

  <rect width="960" height="640" fill="url(#sky)"/>
