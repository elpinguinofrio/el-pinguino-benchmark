        <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(78)"/>
        <ellipse cx="0" cy="0" rx="7" ry="30" transform="rotate(138)"/>
      </g>
      <circle r="8" fill="#24313c"/>
      <circle r="3" fill="#3ee0c5"/>
    </g>
    <circle cx="468" cy="606" r="34" fill="none" stroke="#d5e4ee" stroke-width="2" stroke-dasharray="3 7" opacity="0.45"/>
  </g>

  <g fill="#e7f7fb" opacity="0.55">
    <circle cx="430" cy="618" r="4"/>
    <circle cx="390" cy="632" r="6"/>
    <circle cx="348" cy="624" r="3"/>
    <circle cx="300" cy="646" r="5"/>
    <circle cx="250" cy="636" r="3.5"/>
    <circle cx="210" cy="658" r="4"/>
    <circle cx="160" cy="648" r="2.5"/>
