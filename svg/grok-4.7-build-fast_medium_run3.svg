  <path d="M366 444 C498 434 670 424 900 412 C930 409 948 416 944 424 C860 430 700 436 560 442 C450 446 390 446 366 444 Z" fill="url(#deck)"/>
  <path d="M390 440 C520 432 700 422 910 412" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M430 446 C560 438 760 430 900 420" fill="none" stroke="#3ee0c5" stroke-width="2.5" stroke-linecap="round" opacity="0.8"/>
  <rect x="652" y="444" width="52" height="8" rx="2" fill="#1c2733"/>
  <rect x="668" y="430" width="28" height="8" rx="2" fill="none" stroke="#24313c" stroke-width="1.5"/>

  <!-- penguin -->
  <g filter="url(#soft)">
    <path d="M624 330 C560 348 524 392 546 424 C566 416 600 372 640 348 Z" fill="#1a1c20"/>
    <path d="M742 322 C792 304 834 318 848 346 C826 356 788 350 746 342 Z" fill="#1a1c20"/>
    <path d="M612 392 L582 414 L624 420 Z" fill="#1a1c20"/>
    <ellipse cx="636" cy="438" rx="34" ry="12" fill="#f08a24"/>
    <ellipse cx="678" cy="342" rx="68" ry="104" fill="#1a1c20"/>
    <ellipse cx="698" cy="356" rx="44" ry="78" fill="#fffaf4"/>
    <ellipse cx="708" cy="246" rx="46" ry="42" fill="#1a1c20"/>
    <ellipse cx="732" cy="258" rx="28" ry="26" fill="#fffaf4"/>
    <ellipse cx="724" cy="430" rx="30" ry="11" fill="#f08a24"/>
  </g>

  <g stroke="#d4651a" stroke-width="1.4" stroke-linecap="round">
    <path d="M616 438 l18 7 M626 432 l16 10 M638 428 l12 11"/>
    <path d="M706 430 l16 6 M716 424 l14 9 M726 420 l10 10"/>
  </g>
  <path d="M756 252 L812 260 L754 262 Z" fill="#ffb15a"/>
  <path d="M756 262 L806 266 L752 274 Z" fill="#e86f1a"/>
  <circle cx="744" cy="256" r="9" fill="#fffaf4"/>
  <circle cx="746" cy="256" r="5.5" fill="#1a1c20"/>
  <circle cx="748" cy="254" r="2" fill="#ffffff"/>
  <path d="M732 242 Q744 236 758 244" fill="none" stroke="#1a1c20" stroke-width="3" stroke-linecap="round"/>
  <ellipse cx="724" cy="270" rx="6" ry="3.5" fill="#f3a3a0" opacity="0.7"/>

  <g transform="translate(826 324) rotate(16)">
    <rect x="0" y="0" width="22" height="42" rx="6" fill="#1c1f24"/>
    <rect x="4" y="6" width="14" height="12" rx="2" fill="#16343a"/>
    <circle cx="11" cy="12" r="2.3" fill="#3ee0c5"/>
    <rect x="-7" y="12" width="9" height="14" rx="2" fill="#3a4048"/>
