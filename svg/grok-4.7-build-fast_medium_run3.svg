    <ellipse cx="700" cy="214" rx="176" ry="24" fill="url(#strawDark)"/>
    <ellipse cx="700" cy="204" rx="176" ry="18" fill="url(#straw)"/>
    <ellipse cx="690" cy="198" rx="110" ry="7" fill="#fff1c4" opacity="0.65"/>
