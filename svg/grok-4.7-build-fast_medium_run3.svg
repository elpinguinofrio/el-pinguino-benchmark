<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Penguin in a sombrero riding an e-foil</title>
  <desc id="desc">A penguin wearing a wide straw sombrero stands on an electric hydrofoil board above the water, facing right. The mast drops through the surface to a front wing, a rear wing, and a spinning propeller at the back.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6eb6dd"/>
      <stop offset="0.55" stop-color="#d7f1fb"/>
      <stop offset="1" stop-color="#f3c48a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a8eb2"/>
      <stop offset="0.28" stop-color="#0c648c"/>
      <stop offset="1" stop-color="#062838"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe29a"/>
      <stop offset="1" stop-color="#e2a428"/>
    </linearGradient>
    <linearGradient id="strawDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a82e"/>
      <stop offset="1" stop-color="#b47d16"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf3f7"/>
      <stop offset="0.45" stop-color="#9aabba"/>
      <stop offset="1" stop-color="#4d5e6d"/>
    </linearGradient>
    <linearGradient id="deck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf3"/>
      <stop offset="1" stop-color="#d9d3c7"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3d4c5e"/>
      <stop offset="1" stop-color="#1c2733"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff4c8"/>
      <stop offset="0.6" stop-color="#ffd36a"/>
      <stop offset="1" stop-color="#ffd36a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#062433" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="1100" height="720" fill="url(#sky)"/>
  <circle cx="150" cy="128" r="92" fill="url(#sun)"/>
  <circle cx="150" cy="128" r="40" fill="#ffe7a0"/>

  <g fill="#ffffff">
    <ellipse cx="250" cy="92" rx="26" ry="14"/>
    <ellipse cx="286" cy="86" rx="40" ry="18"/>
    <ellipse cx="324" cy="94" rx="28" ry="13"/>
    <ellipse cx="930" cy="78" rx="22" ry="11" opacity="0.9"/>
    <ellipse cx="958" cy="74" rx="30" ry="13" opacity="0.9"/>
  </g>

  <g fill="none" stroke="#1c3140" stroke-width="2" stroke-linecap="round" opacity="0.35">
    <path d="M96 168 q12 -9 24 0 q12 -9 24 0"/>
    <path d="M150 148 q8 -6 16 0 q8 -6 16 0"/>
