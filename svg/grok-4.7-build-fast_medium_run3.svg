    <path d="M652 200 C646 128 766 118 760 198 C732 186 680 190 652 200 Z" fill="url(#straw)"/>
    <path d="M668 190 C678 146 724 136 736 186" fill="#fff1c4" opacity="0.45"/>
    <path d="M732 146 C756 160 766 186 758 202 C744 176 736 156 732 146 Z" fill="#c88818" opacity="0.35"/>
    <path d="M648 192 C692 178 748 178 766 196 L762 210 C736 198 682 200 646 210 Z" fill="#c81d25"/>
    <path d="M656 202 L668 190 L680 202 L692 190 L704 202 L716 190 L728 202 L740 190 L754 202" fill="none" stroke="#f6e27a" stroke-width="2.2" stroke-linejoin="round"/>
    <circle cx="676" cy="196" r="2.4" fill="#3ee0c5"/>
    <circle cx="720" cy="192" r="2.4" fill="#3ee0c5"/>
  </g>
</svg>
