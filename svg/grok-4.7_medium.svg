      <stop offset="58%" stop-color="#f6d7a8"/>
      <stop offset="100%" stop-color="#fff3dd"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a7c96"/>
      <stop offset="42%" stop-color="#13596e"/>
      <stop offset="100%" stop-color="#0b3144"/>
    </linearGradient>
    <linearGradient id="straw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe08a"/>
      <stop offset="55%" stop-color="#f0b429"/>
      <stop offset="100%" stop-color="#d3922a"/>
    </linearGradient>
    <linearGradient id="strawShade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0a23a"/>
      <stop offset="100%" stop-color="#a86b16"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
