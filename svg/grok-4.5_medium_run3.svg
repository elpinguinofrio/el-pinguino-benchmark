<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Penguin wearing a sombrero riding an e-foil">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="70%" stop-color="#B8E0F0"/>
      <stop offset="100%" stop-color="#E0F4FC"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2E8BC0"/>
      <stop offset="50%" stop-color="#1A5F8A"/>
      <stop offset="100%" stop-color="#0D3B5C"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="50%" stop-color="#FF8C42"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>
    <linearGradient id="sombrero" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F4D03F"/>
      <stop offset="100%" stop-color="#D4A017"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFF7AE"/>
      <stop offset="70%" stop-color="#FFD93D"/>
      <stop offset="100%" stop-color="#FFD93D" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Sky -->
  <rect width="800" height="380" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="680" cy="80" r="55" fill="url(#sun)"/>
  <circle cx="680" cy="80" r="32" fill="#FFD93D"/>

  <!-- Distant clouds -->
  <g fill="#fff" opacity="0.85">
    <ellipse cx="120" cy="70" rx="40" ry="18"/>
    <ellipse cx="150" cy="65" rx="30" ry="16"/>
    <ellipse cx="95" cy="68" rx="25" ry="14"/>
    <ellipse cx="420" cy="95" rx="45" ry="16"/>
    <ellipse cx="455" cy="90" rx="28" ry="14"/>
  </g>

  <!-- Water -->
  <rect y="360" width="800" height="240" fill="url(#water)"/>

  <!-- Water surface shimmer -->
  <path d="M0 360 Q100 350 200 360 T400 360 T600 360 T800 360" fill="none" stroke="#7EC8E3" stroke-width="3" opacity="0.5"/>
  <path d="M0 375 Q80 368 160 375 T320 375 T480 375 T640 375 T800 375" fill="none" stroke="#5BA3C9" stroke-width="2" opacity="0.35"/>

  <!-- Wake / splash behind board -->
  <g opacity="0.7">
    <ellipse cx="280" cy="368" rx="50" ry="10" fill="#A8D8EA"/>
    <ellipse cx="250" cy="372" rx="35" ry="7" fill="#C5E8F5"/>
    <path d="M220 365 Q240 350 250 365 Q245 355 260 360" fill="#E8F6FC" stroke="#fff" stroke-width="1"/>
    <path d="M200 370 Q215 355 230 368" fill="none" stroke="#fff" stroke-width="2" opacity="0.8"/>
    <circle cx="235" cy="358" r="4" fill="#fff" opacity="0.9"/>
    <circle cx="248" cy="352" r="3" fill="#fff" opacity="0.8"/>
    <circle cx="260" cy="360" r="2.5" fill="#fff" opacity="0.7"/>
  </g>

  <!-- Underwater foam trail -->
  <g opacity="0.4">
    <ellipse cx="300" cy="420" rx="20" ry="40" fill="#7EC8E3" transform="rotate(-15 300 420)"/>
    <ellipse cx="290" cy="480" rx="15" ry="30" fill="#5BA3C9" transform="rotate(-10 290 480)"/>
  </g>

  <!-- E-foil assembly -->
  <g filter="url(#softShadow)">
    <!-- Hydrofoil wing (underwater) -->
    <ellipse cx="420" cy="520" rx="70" ry="10" fill="#2C3E50"/>
    <ellipse cx="420" cy="518" rx="65" ry="6" fill="#34495E"/>
    <!-- Rear stabilizer -->
    <ellipse cx="380" cy="500" rx="25" ry="5" fill="#2C3E50"/>
    <!-- Mast -->
    <rect x="412" y="375" width="16" height="145" rx="3" fill="#1C2833"/>
    <rect x="414" y="375" width="5" height="145" rx="1" fill="#5D6D7E" opacity="0.4"/>
    <!-- Board -->
    <ellipse cx="420" cy="370" rx="130" ry="22" fill="url(#board)"/>
    <ellipse cx="420" cy="365" rx="120" ry="14" fill="#FFB347" opacity="0.5"/>
    <!-- Board tip detail -->
    <ellipse cx="530" cy="368" rx="25" ry="10" fill="#E85D04"/>
    <ellipse cx="310" cy="368" rx="20" ry="9" fill="#E85D04"/>
    <!-- Battery / motor housing on board -->
    <rect x="390" y="348" width="55" height="18" rx="4" fill="#1C2833"/>
    <rect x="395" y="351" width="20" height="6" rx="1" fill="#27AE60"/>
    <circle cx="430" cy="357" r="3" fill="#E74C3C"/>
    <!-- Footpad -->
    <rect x="400" y="358" width="40" height="8" rx="2" fill="#2C3E50" opacity="0.6"/>
  </g>

  <!-- Penguin -->
  <g filter="url(#softShadow)" transform="translate(0,-8)">
    <!-- Feet on board -->
    <ellipse cx="405" cy="360" rx="14" ry="6" fill="#FF8C42"/>
    <ellipse cx="435" cy="360" rx="14" ry="6" fill="#FF8C42"/>
    <!-- Legs -->
    <rect x="400" y="330" width="10" height="32" rx="4" fill="#1A1A2E"/>
    <rect x="430" y="330" width="10" height="32" rx="4" fill="#1A1A2E"/>

    <!-- Body (black outer) -->
    <ellipse cx="420" cy="275" rx="48" ry="65" fill="#1A1A2E"/>
    <!-- White belly -->
    <ellipse cx="420" cy="285" rx="32" ry="48" fill="#F8F8FF"/>
    <!-- Subtle belly shading -->
    <ellipse cx="420" cy="300" rx="22" ry="30" fill="#E8E8F0" opacity="0.5"/>

    <!-- Flippers -->
    <ellipse cx="368" cy="280" rx="16" ry="38" fill="#1A1A2E" transform="rotate(-20 368 280)"/>
    <ellipse cx="472" cy="270" rx="16" ry="40" fill="#1A1A2E" transform="rotate(35 472 270)"/>
    <!-- Flipper highlights -->
    <ellipse cx="365" cy="275" rx="6" ry="20" fill="#2D2D44" transform="rotate(-20 365 275)" opacity="0.6"/>
    <ellipse cx="475" cy="265" rx="6" ry="22" fill="#2D2D44" transform="rotate(35 475 265)" opacity="0.6"/>

    <!-- Head -->
    <circle cx="420" cy="200" r="38" fill="#1A1A2E"/>
    <!-- Face white patch -->
    <ellipse cx="420" cy="208" rx="26" ry="24" fill="#F8F8FF"/>

    <!-- Eyes -->
    <ellipse cx="408" cy="200" rx="7" ry="8" fill="#1A1A2E"/>
    <ellipse cx="432" cy="200" rx="7" ry="8" fill="#1A1A2E"/>
    <circle cx="410" cy="198" r="2.5" fill="#fff"/>
    <circle cx="434" cy="198" r="2.5" fill="#fff"/>

    <!-- Beak -->
    <polygon points="420,210 408,222 432,222" fill="#FF8C42"/>
    <polygon points="420,214 412,222 428,222" fill="#FFB347"/>

    <!-- Blush -->
    <ellipse cx="398" cy="215" rx="6" ry="4" fill="#FFB6C1" opacity="0.5"/>
    <ellipse cx="442" cy="215" rx="6" ry="4" fill="#FFB6C1" opacity="0.5"/>

    <!-- Sombrero -->
    <!-- Brim -->
    <ellipse cx="420" cy="175" rx="70" ry="14" fill="url(#sombrero)"/>
    <ellipse cx="420" cy="172" rx="68" ry="10" fill="#F7DC6F" opacity="0.6"/>
    <!-- Crown -->
    <path d="M390 175 Q390 130 420 125 Q450 130 450 175 Z" fill="url(#sombrero)"/>
    <ellipse cx="420" cy="175" rx="30" ry="6" fill="#D4A017"/>
    <!-- Crown top highlight -->
    <ellipse cx="420" cy="140" rx="18" ry="8" fill="#F7DC6F" opacity="0.5"/>
    <!-- Decorative band -->
    <rect x="392" y="158" width="56" height="10" rx="2" fill="#C0392B"/>
    <!-- Band pattern (diamonds) -->
    <polygon points="410,158 415,163 410,168 405,163" fill="#F4D03F"/>
    <polygon points="425,158 430,163 425,168 420,163" fill="#F4D03F"/>
    <polygon points="440,158 445,163 440,168 435,163" fill="#F4D03F"/>
    <!-- Ball tassels on brim tips -->
    <circle cx="355" cy="178" r="5" fill="#C0392B"/>
    <circle cx="485" cy="178" r="5" fill="#C0392B"/>
    <line x1="358" y1="178" x2="370" y2="175" stroke="#8B0000" stroke-width="1.5"/>
    <line x1="482" y1="178" x2="470" y2="175" stroke="#8B0000" stroke-width="1.5"/>
  </g>

  <!-- Speed lines -->
  <g stroke="#fff" stroke-width="2" opacity="0.35" stroke-linecap="round">
    <line x1="160" y1="340" x2="220" y2="340"/>
    <line x1="140" y1="355" x2="200" y2="355"/>
    <line x1="170" y1="325" x2="210" y2="325"/>
  </g>

  <!-- Small fish underwater for fun -->
  <g opacity="0.55">
    <ellipse cx="560" cy="480" rx="18" ry="9" fill="#F39C12"/>
    <polygon points="542,480 530,472 530,488" fill="#F39C12"/>
    <circle cx="568" cy="478" r="2" fill="#1A1A2E"/>
    <ellipse cx="650" cy="530" rx="14" ry="7" fill="#E74C3C"/>
    <polygon points="636,530 626,524 626,536" fill="#E74C3C"/>
    <circle cx="656" cy="528" r="1.5" fill="#1A1A2E"/>
  </g>
</svg>
