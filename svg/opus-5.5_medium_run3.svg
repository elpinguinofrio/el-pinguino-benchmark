<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7cc7f2"/>
      <stop offset="1" stop-color="#d9f1fb"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a8fc4"/>
      <stop offset="1" stop-color="#0d4f7a"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#d94a12"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d37a"/>
      <stop offset="1" stop-color="#d9a640"/>
    </linearGradient>
  </defs>

  <!-- sky and sun -->
  <rect width="800" height="600" fill="url(#sky)"/>
  <circle cx="680" cy="100" r="50" fill="#ffe27a"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="160" cy="90" rx="60" ry="18"/>
    <ellipse cx="200" cy="78" rx="40" ry="18"/>
    <ellipse cx="480" cy="140" rx="50" ry="14"/>
  </g>

  <!-- sea -->
  <rect y="390" width="800" height="210" fill="url(#sea)"/>
  <path d="M0 390 Q 50 380 100 390 T 200 390 T 300 390 T 400 390 T 500 390 T 600 390 T 700 390 T 800 390 V 400 H 0 Z" fill="#5cb8e6"/>

  <!-- submerged mast + hydrofoil (visible through water) -->
  <g opacity="0.75">
    <rect x="392" y="372" width="12" height="130" fill="#333"/>
    <!-- fuselage -->
    <rect x="320" y="498" width="170" height="10" rx="5" fill="#222"/>
    <!-- front wing -->
    <path d="M300 500 Q 335 488 370 500 Q 335 512 300 500 Z" fill="#111"/>
    <!-- rear stabilizer -->
    <path d="M465 501 Q 485 494 505 501 Q 485 508 465 501 Z" fill="#111"/>
    <!-- motor pod + propeller -->
    <ellipse cx="398" cy="482" rx="22" ry="8" fill="#444"/>
    <g fill="#bbb">
      <ellipse cx="424" cy="474" rx="3" ry="10"/>
      <ellipse cx="424" cy="490" rx="3" ry="10"/>
    </g>
    <!-- bubbles -->
    <g fill="#bfe8ff">
      <circle cx="440" cy="480" r="4"/>
      <circle cx="455" cy="474" r="3"/>
      <circle cx="470" cy="486" r="2.5"/>
      <circle cx="490" cy="478" r="2"/>
    </g>
  </g>

  <!-- wake spray behind board -->
  <g fill="#ffffff" opacity="0.9">
    <path d="M470 392 Q 540 370 620 388 Q 560 384 470 398 Z"/>
    <path d="M470 396 Q 560 400 680 392 Q 580 408 470 402 Z" opacity="0.7"/>
    <circle cx="610" cy="378" r="4"/>
    <circle cx="640" cy="384" r="3"/>
    <circle cx="590" cy="370" r="3"/>
  </g>

  <!-- mast above water -->
  <rect x="392" y="352" width="12" height="40" fill="#2b2b2b"/>
  <rect x="390" y="388" width="16" height="4" fill="#ffffff" opacity="0.7"/>

  <!-- board -->
  <path d="M250 340 Q 245 352 262 356 L 520 356 Q 548 352 552 340 Q 548 330 520 330 L 270 330 Q 252 330 250 340 Z" fill="url(#board)" stroke="#8a2d05" stroke-width="2"/>
  <rect x="300" y="333" width="190" height="6" rx="3" fill="#2d2d2d" opacity="0.6"/>

  <!-- remote cord (handheld throttle shown in flipper) -->

  <!-- penguin -->
  <g>
    <!-- feet -->
    <path d="M340 332 Q 345 318 360 322 Q 372 326 370 333 Z" fill="#f59b1c"/>
    <path d="M415 332 Q 420 318 435 322 Q 447 326 445 333 Z" fill="#f59b1c"/>

    <!-- body -->
    <ellipse cx="392" cy="245" rx="70" ry="88" fill="#1c1f26"/>
    <!-- belly -->
    <ellipse cx="398" cy="258" rx="48" ry="70" fill="#f8f8f4"/>

    <!-- left flipper (back, balancing out) -->
    <path d="M330 220 Q 280 225 262 262 Q 290 250 335 255 Z" fill="#1c1f26"/>
    <!-- right flipper holding throttle -->
    <path d="M455 220 Q 500 230 510 270 Q 488 258 455 255 Z" fill="#1c1f26"/>
    <!-- throttle remote -->
    <rect x="500" y="260" width="16" height="28" rx="6" fill="#3a3f4a" stroke="#111" stroke-width="1.5"/>
    <circle cx="508" cy="268" r="3" fill="#41d36b"/>

    <!-- head -->
    <circle cx="398" cy="160" r="48" fill="#1c1f26"/>
    <!-- face patch -->
    <path d="M370 165 Q 372 130 398 132 Q 428 130 432 165 Q 426 195 400 196 Q 374 194 370 165 Z" fill="#f8f8f4"/>
    <!-- eyes -->
    <ellipse cx="386" cy="158" rx="6" ry="8" fill="#ffffff" stroke="#1c1f26" stroke-width="1"/>
    <ellipse cx="414" cy="158" rx="6" ry="8" fill="#ffffff" stroke="#1c1f26" stroke-width="1"/>
    <circle cx="388" cy="160" r="3.5" fill="#000"/>
    <circle cx="416" cy="160" r="3.5" fill="#000"/>
    <circle cx="389" cy="158.5" r="1.2" fill="#fff"/>
    <circle cx="417" cy="158.5" r="1.2" fill="#fff"/>
    <!-- cheeks -->
    <ellipse cx="378" cy="176" rx="6" ry="3.5" fill="#ff9aa8" opacity="0.6"/>
    <ellipse cx="422" cy="176" rx="6" ry="3.5" fill="#ff9aa8" opacity="0.6"/>
    <!-- beak -->
    <path d="M388 172 Q 400 166 414 172 L 400 186 Z" fill="#f59b1c" stroke="#c8730a" stroke-width="1"/>
    <path d="M391 175 Q 400 179 411 175" fill="none" stroke="#c8730a" stroke-width="1.2"/>

    <!-- sombrero -->
    <g>
      <!-- brim -->
      <ellipse cx="398" cy="122" rx="110" ry="22" fill="url(#hat)" stroke="#9b6c1a" stroke-width="2"/>
      <ellipse cx="398" cy="118" rx="96" ry="15" fill="none" stroke="#c2402b" stroke-width="4"/>
      <!-- crown -->
      <path d="M358 120 Q 360 62 398 56 Q 436 62 438 120 Q 398 130 358 120 Z" fill="url(#hat)" stroke="#9b6c1a" stroke-width="2"/>
      <!-- band -->
      <path d="M361 104 Q 398 114 435 104 L 437 116 Q 398 126 359 116 Z" fill="#c2402b"/>
      <g fill="#2e9c4a">
        <circle cx="372" cy="111" r="3"/>
        <circle cx="398" cy="115" r="3"/>
        <circle cx="424" cy="111" r="3"/>
      </g>
      <g fill="#fff3c4">
        <circle cx="385" cy="114" r="2"/>
        <circle cx="411" cy="114" r="2"/>
      </g>
      <!-- pompoms on brim -->
      <g fill="#c2402b">
        <circle cx="292" cy="128" r="5"/>
        <circle cx="330" cy="140" r="5"/>
        <circle cx="398" cy="145" r="5"/>
        <circle cx="466" cy="140" r="5"/>
        <circle cx="504" cy="128" r="5"/>
      </g>
    </g>
  </g>

  <!-- motion lines -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <line x1="580" y1="230" x2="650" y2="230"/>
    <line x1="560" y1="260" x2="640" y2="260"/>
    <line x1="590" y1="290" x2="660" y2="290"/>
  </g>
</svg>
