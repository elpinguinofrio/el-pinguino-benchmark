<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#eaf7ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2aa7d8"/>
      <stop offset="1" stop-color="#0b5f8f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="330" cy="60" r="28" fill="#ffe27a"/>
  <rect y="250" width="400" height="150" fill="url(#sea)"/>
  <path d="M0 262 Q25 252 50 262 T100 262 T150 262 T200 262 T250 262 T300 262 T350 262 T400 262" fill="none" stroke="#fff" stroke-width="3" opacity=".6"/>
  <!-- spray -->
  <path d="M95 268 q-20 -10 -35 4 q15 -2 35 8z" fill="#fff" opacity=".8"/>
  <path d="M110 275 q-25 5 -40 18 q20 -8 42 -8z" fill="#fff" opacity=".6"/>
  <!-- mast and wing underwater -->
  <rect x="195" y="285" width="8" height="70" fill="#4a4f57"/>
  <path d="M150 360 Q200 345 250 360 Q200 368 150 360z" fill="#6b7280"/>
  <rect x="180" y="352" width="40" height="10" rx="5" fill="#4a4f57" opacity=".0"/>
