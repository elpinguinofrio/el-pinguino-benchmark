<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ec8f0"/>
      <stop offset="1" stop-color="#d9f1ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e88c7"/>
      <stop offset="1" stop-color="#0b4f7a"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a2e"/>
      <stop offset="1" stop-color="#ffb347"/>
    </linearGradient>
  </defs>

  <!-- Sky and sun -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <circle cx="335" cy="65" r="32" fill="#ffd84a"/>

  <!-- Sea -->
  <rect y="285" width="400" height="115" fill="url(#sea)"/>
  <path d="M0 290 Q25 282 50 290 T100 290 T150 290 T200 290 T250 290 T300 290 T350 290 T400 290" fill="none" stroke="#bfe6ff" stroke-width="3"/>

  <!-- E-foil mast, fuselage, wings (under water) -->
  <rect x="196" y="262" width="8" height="78" fill="#333"/>
  <rect x="150" y="336" width="110" height="7" rx="3.5" fill="#333"/>
  <path d="M140 339 Q170 328 200 339 Q170 350 140 339 Z" fill="#222"/>
  <path d="M238 339 Q252 333 266 339 Q252 345 238 339 Z" fill="#222"/>
  <!-- Motor pod and propeller -->
  <ellipse cx="200" cy="320" rx="16" ry="7" fill="#555"/>
  <rect x="214" y="316" width="4" height="8" fill="#555"/>
  <ellipse cx="221" cy="320" rx="2.5" ry="11" fill="#999"/>
  <!-- Wake bubbles -->
  <circle cx="234" cy="318" r="3" fill="#bfe6ff" opacity="0.8"/>
  <circle cx="244" cy="322" r="2" fill="#bfe6ff" opacity="0.8"/>
  <circle cx="252" cy="316" r="1.6" fill="#bfe6ff" opacity="0.8"/>

  <!-- Board -->
  <path d="M95 255 Q100 247 120 247 L300 247 Q322 249 325 256 Q320 265 300 265 L118 265 Q98 264 95 255 Z" fill="url(#board)" stroke="#a84a12" stroke-width="2"/>
  <rect x="150" y="253" width="100" height="3" fill="#fff" opacity="0.6"/>

  <!-- Spray behind board -->
  <path d="M95 262 Q70 255 58 270 Q75 266 92 272 Z" fill="#e8f7ff" opacity="0.9"/>

  <!-- Penguin feet -->
  <ellipse cx="180" cy="246" rx="16" ry="5" fill="#ff9a1f"/>
  <ellipse cx="222" cy="246" rx="16" ry="5" fill="#ff9a1f"/>

  <!-- Penguin body -->
  <ellipse cx="200" cy="190" rx="48" ry="60" fill="#1b1b1f"/>
  <ellipse cx="200" cy="200" rx="33" ry="46" fill="#ffffff"/>

  <!-- Flippers: one out for balance, one holding remote -->
  <path d="M154 175 Q118 185 110 215 Q135 205 158 200 Z" fill="#1b1b1f"/>
  <path d="M246 175 Q280 168 292 150 Q272 182 246 200 Z" fill="#1b1b1f"/>
  <rect x="287" y="138" width="10" height="18" rx="4" fill="#e23b3b"/>
  <circle cx="292" cy="143" r="2" fill="#fff"/>

  <!-- Head -->
  <circle cx="200" cy="122" r="34" fill="#1b1b1f"/>
  <ellipse cx="188" cy="125" rx="11" ry="13" fill="#fff"/>
  <ellipse cx="212" cy="125" rx="11" ry="13" fill="#fff"/>
  <circle cx="190" cy="125" r="4.5" fill="#111"/>
  <circle cx="210" cy="125" r="4.5" fill="#111"/>
  <circle cx="191.5" cy="123.5" r="1.5" fill="#fff"/>
  <circle cx="211.5" cy="123.5" r="1.5" fill="#fff"/>
  <!-- Beak -->
  <path d="M190 138 L210 138 L200 152 Z" fill="#ff9a1f"/>
  <!-- Cheeks -->
  <circle cx="178" cy="140" r="4" fill="#ff9fb0" opacity="0.7"/>
  <circle cx="222" cy="140" r="4" fill="#ff9fb0" opacity="0.7"/>

  <!-- Sombrero -->
  <ellipse cx="200" cy="98" rx="78" ry="16" fill="#e8b04a" stroke="#9c6b1c" stroke-width="2"/>
  <path d="M174 98 Q172 58 200 52 Q228 58 226 98 Z" fill="#f0c25e" stroke="#9c6b1c" stroke-width="2"/>
  <path d="M175 88 Q200 96 225 88 L226 96 Q200 104 174 96 Z" fill="#d6342c"/>
  <circle cx="186" cy="92" r="2.5" fill="#2e9e4f"/>
  <circle cx="200" cy="95" r="2.5" fill="#2e9e4f"/>
  <circle cx="214" cy="92" r="2.5" fill="#2e9e4f"/>
  <path d="M126 100 Q200 120 274 100" fill="none" stroke="#d6342c" stroke-width="3"/>
  <circle cx="122" cy="99" r="4" fill="#d6342c"/>
  <circle cx="278" cy="99" r="4" fill="#d6342c"/>
</svg>
