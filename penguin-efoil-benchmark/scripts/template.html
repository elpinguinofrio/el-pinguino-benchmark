<title>{{TITLE}}</title>
<meta name="description" content="{{DESC}}">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: hero with prompt and diagram, short takeaways, then a wide gallery of model sections. */
:root {
  --sea: #eaf3f2;        /* page ground: pale sea glass */
  --foam: #ffffff;       /* cards */
  --ink: #0f2b33;        /* text */
  --muted: #4c6670;      /* secondary text */
  --line: #cfe0de;       /* hairlines */
  --board: #d9561f;      /* accent: e-foil board orange */
  --straw: #b7861c;      /* sombrero straw */
  --deep: #0e4f63;       /* deep water */
  --chip: #dcebe9;
  --f-display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --f-body: "Instrument Sans", "Helvetica Neue", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --sea: #0a1a20; --foam: #112830; --ink: #e2eeec; --muted: #9db4b9; --line: #23414a;
  --board: #f07a45; --straw: #e0b24e; --deep: #5fb7cf; --chip: #17343d; color-scheme: dark } }
:root[data-theme="dark"] {
  --sea: #0a1a20; --foam: #112830; --ink: #e2eeec; --muted: #9db4b9; --line: #23414a;
  --board: #f07a45; --straw: #e0b24e; --deep: #5fb7cf; --chip: #17343d; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--sea); color: var(--ink); font: 400 16px/1.6 var(--f-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 64px }
.wrap { max-width: 1180px; margin: 0 auto }
.read { max-width: 68ch }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em }
h1 { font-weight: 800; font-size: clamp(2.4rem, 7vw, 4.6rem); line-height: 0.98 }
h2 { font-weight: 800; font-size: clamp(1.5rem, 3.5vw, 2.1rem); line-height: 1.1 }
h3 { font-weight: 600; font-size: 1.3rem; line-height: 1.2 }
p { margin: 0 }
a { color: var(--deep) }
:focus-visible { outline: 3px solid var(--board); outline-offset: 2px; border-radius: 4px }
.eyebrow { font: 500 0.75rem/1 var(--f-mono); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted) }

/* hero */
.hero { padding-block: 28px 32px; display: grid; gap: 28px; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); align-items: center }
.hero-text { display: grid; gap: 18px; min-width: 0 }
.lead { font-size: 1.12rem; color: var(--muted); max-width: 56ch }
.lead strong { color: var(--ink); font-weight: 600 }
.prompt { background: var(--foam); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 10px }
.prompt code { font: 500 0.98rem/1.5 var(--f-mono); color: var(--ink); overflow-wrap: anywhere }
.prompt-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.copy { font: 600 0.85rem var(--f-body); background: var(--ink); color: var(--sea); border: 0; border-radius: 999px; padding: 7px 14px; cursor: pointer }
.stats { display: flex; gap: 28px; flex-wrap: wrap }
.stat b { display: block; font: 800 1.9rem/1 var(--f-display); font-variant-numeric: tabular-nums }
.stat span { font-size: 0.85rem; color: var(--muted) }

/* anatomy diagram */
.anatomy { background: var(--foam); border: 1px solid var(--line); border-radius: 14px; padding: 14px; min-width: 0 }
.anatomy svg { display: block; width: 100%; height: auto }
.anatomy figcaption { font-size: 0.85rem; color: var(--muted); padding: 6px 4px 0 }
.a-label { font: 500 12px var(--f-mono); fill: var(--ink) }
.a-lead { stroke: var(--muted); stroke-width: 1; fill: none }

/* findings */
.section { padding-block: 36px; border-top: 1px solid var(--line); display: grid; gap: 20px }
.findings { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)) }
.findings li { background: var(--foam); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; display: grid; gap: 6px; min-width: 0 }
.findings b { font-family: var(--f-display); font-weight: 600; font-size: 1.08rem }
.findings p { color: var(--muted); font-size: 0.95rem }

/* nav chips */
.nav { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--sea); padding-block: 10px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--line) }
.nav::-webkit-scrollbar { display: none }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sea) }
.chip { flex: 0 0 auto; text-decoration: none; color: var(--ink); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-size: 0.85rem; font-weight: 500; white-space: nowrap }
.chip:hover { background: var(--line) }

/* models */
.models { display: grid; gap: 44px; padding-top: 28px }
.model { display: grid; gap: 14px; scroll-margin-top: 64px }
.mh { display: grid; gap: 6px; max-width: 76ch }
.mh-top { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
.fam { font: 500 0.7rem/1 var(--f-mono); letter-spacing: 0.08em; text-transform: uppercase; padding: 5px 8px; border-radius: 4px; border: 1px solid var(--line); color: var(--muted) }
.fam-claude { color: var(--board); border-color: var(--board) }
.fam-claude-old { color: var(--straw); border-color: var(--straw) }
.harness { font: 400 0.8rem var(--f-mono); color: var(--muted) }
.note { font-size: 0.98rem }
.shots { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(46%, 220px), 1fr)) }
.shot { margin: 0; background: var(--foam); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; display: grid; grid-template-rows: auto auto }
.zoom { all: unset; cursor: zoom-in; display: block; aspect-ratio: 4 / 3; background: var(--foam) }
.zoom img { width: 100%; height: 100%; object-fit: contain; display: block }
.shot figcaption { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 8px; padding: 8px 10px; border-top: 1px solid var(--line); font-size: 0.85rem }
.run { font-weight: 600 }
.meta { color: var(--muted); font-family: var(--f-mono); font-size: 0.78rem; font-variant-numeric: tabular-nums }

/* method */
.method { display: grid; gap: 10px; color: var(--muted); font-size: 0.95rem }
.method ul { margin: 0; padding-left: 1.1em; display: grid; gap: 6px }
.method b { color: var(--ink) }

/* lightbox */
dialog { border: 0; padding: 0; background: transparent; max-width: min(96vw, 1000px); width: 100% }
dialog::backdrop { background: rgba(5, 18, 24, 0.82) }
.lb { background: var(--foam); border-radius: 12px; overflow: hidden; display: grid }
.lb img { width: 100%; max-height: 78vh; object-fit: contain; background: var(--foam) }
.lb-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 14px; font-size: 0.9rem }
.lb-close { font: 600 0.85rem var(--f-body); background: var(--chip); color: var(--ink); border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer }

@media (max-width: 760px) {
  .hero { grid-template-columns: minmax(0, 1fr); padding-block: 32px 20px }
}
@media (prefers-reduced-motion: no-preference) {
  .zoom img { transition: transform .25s ease }
  .zoom:hover img { transform: scale(1.03) }
}

/* top bar, takeaways, details, footer */
.top { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 16px; font-size: 0.9rem }
.top .links { display: flex; gap: 8px; flex-wrap: wrap }
.top a { text-decoration: none }
.pill { color: var(--ink); background: var(--chip); border-radius: 999px; padding: 6px 12px; font-weight: 600 }
.pelican { font-size: 0.92rem; color: var(--muted) }
.takes { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)) }
.takes li { background: var(--foam); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px }
.takes b { font: 800 1.15rem/1.15 var(--f-display) }
.takes span { color: var(--muted); font-size: 0.92rem }
details.method summary { cursor: pointer; font: 800 1.3rem var(--f-display); color: var(--ink) }
details.method ul { margin-top: 12px }
footer { border-top: 1px solid var(--line); padding-top: 20px; margin-top: 36px; font-size: 0.85rem; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap }
</style>

<div class="wrap">
  <div class="top"><span class="eyebrow">{{EYEBROW}}</span><span class="links">{{TOPLINKS}}</span></div>
  <section class="hero">
    <div class="hero-text">
      <h1>{{TITLE}}</h1>
      <p class="lead">{{TAGLINE}}</p>
      <div class="prompt">
        <div class="prompt-row"><span class="eyebrow">{{PROMPT_LABEL}}</span><button class="copy" id="copy-prompt" type="button" data-done="{{COPIED}}">{{COPY}}</button></div>
        <code id="prompt-text">{{PROMPT}}</code>
      </div>
      <div class="stats">
        <div class="stat"><b>{{MODELS_COUNT}}</b><span>{{MODELS_WORD}}</span></div>
        <div class="stat"><b>{{TOTAL}}</b><span>{{DRAWINGS_WORD}}</span></div>
        <div class="stat"><b>1</b><span>{{PROMPTS_WORD}}</span></div>
      </div>
      <p class="pelican">{{PELICAN}}</p>
    </div>
    <figure class="anatomy">
      {{DIAGRAM}}
      <figcaption>{{DIAGRAM_CAPTION}}</figcaption>
    </figure>
  </section>

  <section class="section">
    <h2>{{TAKEAWAYS_HEAD}}</h2>
    <ul class="takes">{{TAKEAWAYS}}</ul>
  </section>

  <nav class="nav" aria-label="Models">{{NAV}}</nav>

  <div class="models">{{MODELS}}</div>

  <section class="section">
    <details class="method"><summary>{{METHOD_HEAD}}</summary><ul>{{METHOD}}</ul></details>
  </section>
  <footer>{{FOOTER}}</footer>
</div>

<dialog id="lightbox" aria-label="Drawing">
  <div class="lb">
    <img id="lb-img" alt="">
    <div class="lb-bar"><span id="lb-cap"></span><button class="lb-close" id="lb-close" type="button">{{CLOSE}}</button></div>
  </div>
</dialog>

<script>
(function () {
  var dlg = document.getElementById("lightbox"), img = document.getElementById("lb-img"), cap = document.getElementById("lb-cap");
  document.querySelectorAll(".zoom").forEach(function (b) {
    b.addEventListener("click", function () {
      img.src = b.dataset.src; img.alt = b.querySelector("img").alt; cap.textContent = b.dataset.cap;
      if (dlg.showModal) dlg.showModal();
    });
  });
  document.getElementById("lb-close").addEventListener("click", function () { dlg.close(); });
  dlg.addEventListener("click", function (e) { if (e.target === dlg) dlg.close(); });
  var btn = document.getElementById("copy-prompt"), txt = document.getElementById("prompt-text");
  btn.addEventListener("click", function () {
    var done = function () { var o = btn.textContent; btn.textContent = btn.dataset.done; setTimeout(function () { btn.textContent = o; }, 1600); };
    var fallback = function () { var r = document.createRange(); r.selectNodeContents(txt); var s = getSelection(); s.removeAllRanges(); s.addRange(r);  };
    try { navigator.clipboard.writeText(txt.textContent).then(done, fallback); } catch (e) { fallback(); }
  });
})();
</script>
