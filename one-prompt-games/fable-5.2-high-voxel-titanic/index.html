function bfs(){dist.fill(255);let qa=Q1,qb=Q2,na=0,nb=0;const e0=SY*(Math.floor((WL-OY)*2.5)+1);

function structural(){needStruct=false;const e0=bfs();const NB=[1,-1,GZ,-GZ,SY,-SY];let any=false;const dl=[];

const pieces=[];
function makePiece(cells,dl){const n=cells.length;let sx=0,sy=0,sz=0,x0=1e9,y0=1e9,z0=1e9,x1=-1e9,y1=-1e9,z1=-1e9;

function rot(ax,a,R){const c=Math.cos(a),s=Math.sin(a),t=1-c,[x,y,z]=ax;R[0]=t*x*x+c;R[1]=t*x*y+s*z;R[2]=t*x*z-s*y;R[3]=t*x*y-s*z;R[4]=t*y*y+c;R[5]=t*y*z+s*x;R[6]=t*x*z+s*y;R[7]=t*y*z-s*x;R[8]=t*z*z+c;}

const MAXP=9000,PD=new Float32Array(MAXP*9),PI=new Float32Array(MAXP*5);let np=0;

// ---------- camera / input ----------
const cam=[148,27.7,0];let yaw=0,pitch=0,vy=0,tool=1,mdown=false,lastCut=0,frozen=false;const keys={};const shots=[];
function hbM(x,y){if(y<0||y>26)return 0;const xs=y<10.5?6+(10.5-y)*0.55:Math.max(0,6-(y-10.5)*1.5),xb=269-(26-y)*0.1;if(x<=xs||x>=xb)return 0;
  let f=1;const t=(xb-x)/66;if(t<1)f=Math.pow(t,0.62);const sr=y<10.5?58:34,e=y<10.5?0.75:0.42,u=(x-xs)/sr;if(u<1)f=Math.min(f,Math.pow(u,e));

const TOOLS=['','Cannon','Dynamite','Cutter','Torpedo'];
const TP={Digit5:[196.9,30.6,.8,0],Digit6:[148,27.7,0,0],Digit7:[107.2,19.05,-6.4,0],Digit8:[113.5,3.3,2.55,0],Digit9:[72,3.3,0,0],Digit0:[164.5,30.6,6,0]};
addEventListener('keydown',e=>{keys[e.code]=1;
  if(e.code>='Digit1'&&e.code<='Digit4')tool=+e.code[5];
  if(TP[e.code])tp(TP[e.code]);if(e.code=='KeyR')tp(TP.Digit0);
  if(e.code=='Space')e.preventDefault();});

cv.addEventListener('mousedown',e=>{if(document.pointerLockElement!==cv){try{const r=cv.requestPointerLock();if(r&&r.catch)r.catch(()=>{});}catch(_){}}mdown=true;fire();});

function boxSolid(x,y,z){for(let b=.05;b<1.75;b+=.15)for(let a=-.2;a<=.21;a+=.1)for(let c=-.2;c<=.21;c+=.1)if(solidAt(x+a,y+b,z+c))return true;return false;}
function move(dt){if(keys.KeyA)yaw-=1.8*dt;if(keys.KeyD)yaw+=1.8*dt;
