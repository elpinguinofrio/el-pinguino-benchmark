<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="600" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#87CEEB"/>
      <stop offset="100%" stop-color="#E0F0FF"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#0A3D6B"/>
    </linearGradient>
    <linearGradient id="sombreroGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#D2691E"/>
      <stop offset="100%" stop-color="#8B4513"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="600" height="500" fill="url(#sky)"/>

  <!-- Sun -->
  <circle cx="520" cy="70" r="45" fill="#FFD700" opacity="0.9"/>
  <circle cx="520" cy="70" r="55" fill="#FFD700" opacity="0.2"/>

  <!-- Clouds -->
  <g fill="white" opacity="0.8">
    <ellipse cx="120" cy="60" rx="50" ry="20"/>
    <ellipse cx="150" cy="50" rx="40" ry="18"/>
    <ellipse cx="90" cy="55" rx="35" ry="15"/>
  </g>
  <g fill="white" opacity="0.6">
    <ellipse cx="400" cy="90" rx="45" ry="17"/>
    <ellipse cx="430" cy="82" rx="35" ry="14"/>
  </g>

  <!-- Water -->
  <rect x="0" y="320" width="600" height="180" fill="url(#water)"/>

  <!-- Waves -->
  <path d="M0 340 Q30 330 60 340 Q90 350 120 340 Q150 330 180 340 Q210 350 240 340 Q270 330 300 340 Q330 350 360 340 Q390 330 420 340 Q450 350 480 340 Q510 330 540 340 Q570 350 600 340 L600 350 Q570 360 540 350 Q510 340 480 350 Q450 360 420 350 Q390 340 360 350 Q330 360 300 350 Q270 340 240 350 Q210 360 180 350 Q150 340 120 350 Q90 360 60 350 Q30 340 0 350 Z" fill="#3AA5E8" opacity="0.5"/>
  <path d="M0 360 Q40 350 80 360 Q120 370 160 360 Q200 350 240 360 Q280 370 320 360 Q360 350 400 360 Q440 370 480 360 Q520 350 560 360 Q580 365 600 360 L600 370 L0 370 Z" fill="#2B8CC4" opacity="0.4"/>

  <!-- Spray/splash behind board -->
  <g fill="white" opacity="0.7">
    <ellipse cx="195" cy="325" rx="12" ry="5"/>
    <ellipse cx="180" cy="318" rx="6" ry="3"/>
    <ellipse cx="205" cy="315" rx="8" ry="3"/>
    <circle cx="175" cy="310" r="3"/>
    <circle cx="210" cy="308" r="2.5"/>
    <circle cx="190" cy="305" r="2"/>
  </g>

  <!-- E-Foil Hydrofoil (underwater parts) -->
  <!-- Mast -->
  <rect x="295" y="328" width="4" height="65" fill="#444" rx="1"/>
  <!-- Front wing -->
  <ellipse cx="297" cy="393" rx="55" ry="6" fill="#555"/>
  <!-- Rear stabilizer -->
  <ellipse cx="297" cy="380" rx="25" ry="4" fill="#555"/>
  <!-- Fuselage -->
  <rect x="275" y="377" width="44" height="5" fill="#444" rx="2"/>

  <!-- E-Foil Board -->
  <path d="M220 318 Q230 308 300 306 Q370 308 380 318 Q370 330 300 332 Q230 330 220 318 Z" fill="#2C2C2C" stroke="#111" stroke-width="1.5"/>
  <!-- Board deck pad -->
  <path d="M245 316 Q260 310 300 309 Q340 310 355 316 Q340 323 300 325 Q260 323 245 316 Z" fill="#3A3A3A"/>
  <!-- Board accent stripe -->
  <path d="M235 318 Q260 312 300 311 Q340 312 365 318" stroke="#00BFFF" stroke-width="2" fill="none"/>

  <!-- Penguin Body -->
  <g transform="translate(295, 230)">
    <!-- Body (black back) -->
    <ellipse cx="0" cy="40" rx="32" ry="45" fill="#1a1a1a"/>
    <!-- Belly (white) -->
    <ellipse cx="0" cy="42" rx="22" ry="38" fill="#F5F5F5"/>

    <!-- Left wing/flipper (extended for balance!) -->
    <path d="M-30 20 Q-55 5 -65 -10 Q-68 -15 -62 -14 Q-50 -8 -28 12" fill="#1a1a1a" stroke="#111" stroke-width="1"/>
    <!-- Right wing/flipper -->
    <path d="M30 20 Q55 5 65 -10 Q68 -15 62 -14 Q50 -8 28 12" fill="#1a1a1a" stroke="#111" stroke-width="1"/>

    <!-- Feet on board -->
    <ellipse cx="-12" cy="82" rx="10" ry="5" fill="#FF8C00" transform="rotate(-5, -12, 82)"/>
    <ellipse cx="12" cy="82" rx="10" ry="5" fill="#FF8C00" transform="rotate(5, 12, 82)"/>

    <!-- Head -->
    <ellipse cx="0" cy="-10" rx="26" ry="24" fill="#1a1a1a"/>

    <!-- White face patches -->
    <ellipse cx="-10" cy="-8" rx="10" ry="12" fill="#F5F5F5"/>
    <ellipse cx="10" cy="-8" rx="10" ry="12" fill="#F5F5F5"/>

    <!-- Eyes -->
    <circle cx="-9" cy="-12" r="4.5" fill="white"/>
    <circle cx="9" cy="-12" r="4.5" fill="white"/>
    <circle cx="-8" cy="-12" r="2.5" fill="#111"/>
    <circle cx="10" cy="-12" r="2.5" fill="#111"/>
    <!-- Eye shine -->
    <circle cx="-7" cy="-13.5" r="1" fill="white"/>
    <circle cx="11" cy="-13.5" r="1" fill="white"/>

    <!-- Beak -->
    <path d="M-5 -4 L0 4 L5 -4 Z" fill="#FF8C00" stroke="#E07000" stroke-width="0.5"/>

    <!-- Happy mouth -->
    <path d="M-4 0 Q0 3 4 0" stroke="#E07000" stroke-width="1" fill="none"/>

    <!-- SOMBRERO -->
    <g transform="translate(0, -28)">
      <!-- Brim -->
      <ellipse cx="0" cy="0" rx="45" ry="12" fill="url(#sombreroGrad)"/>
      <!-- Brim underside shadow -->
      <ellipse cx="0" cy="2" rx="43" ry="10" fill="#6B3410" opacity="0.4"/>
      <!-- Crown base -->
      <ellipse cx="0" cy="-3" rx="20" ry="8" fill="#A0522D"/>
      <!-- Crown -->
      <path d="M-20 -3 Q-20 -28 -14 -32 Q0 -38 14 -32 Q20 -28 20 -3" fill="#C0713D"/>
      <!-- Crown top -->
      <ellipse cx="0" cy="-32" rx="14" ry="5" fill="#D2841E"/>
      <!-- Decorative band -->
      <rect x="-20" y="-10" width="40" height="6" fill="#FF4500" rx="1"/>
      <!-- Zigzag pattern on band -->
      <path d="M-19 -7 L-15 -10 L-11 -7 L-7 -10 L-3 -7 L1 -10 L5 -7 L9 -10 L13 -7 L17 -10 L19 -7" stroke="#FFD700" stroke-width="1.2" fill="none"/>
      <!-- Little ball on top -->
      <circle cx="0" cy="-36" r="3" fill="#FF4500"/>
    </g>

    <!-- Sunglasses (because cool penguins wear shades) -->
    <g transform="translate(0, -12)">
      <rect x="-16" y="-5" width="12" height="9" rx="2" fill="#222" opacity="0.85"/>
      <rect x="4" y="-5" width="12" height="9" rx="2" fill="#222" opacity="0.85"/>
      <line x1="-4" y1="-1" x2="4" y2="-1" stroke="#333" stroke-width="1.5"/>
      <!-- Reflection on glasses -->
      <rect x="-14" y="-3" width="4" height="2" rx="1" fill="white" opacity="0.3"/>
      <rect x="6" y="-3" width="4" height="2" rx="1" fill="white" opacity="0.3"/>
    </g>
  </g>

  <!-- More splash in front -->
  <g fill="white" opacity="0.6">
    <ellipse cx="370" cy="322" rx="10" ry="4"/>
    <ellipse cx="385" cy="316" rx="7" ry="3"/>
    <circle cx="390" cy="310" r="2.5"/>
    <circle cx="378" cy="308" r="2"/>
  </g>

  <!-- Motion lines -->
  <g stroke="white" stroke-width="1.5" opacity="0.5">
    <line x1="200" y1="315" x2="170" y2="312"/>
    <line x1="205" y1="322" x2="165" y2="320"/>
    <line x1="200" y1="328" x2="175" y2="328"/>
  </g>
</svg>
