<svg width="300" height="200" viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg" aria-label="Penguin wearing a sombrero riding an e-foil">
  <!-- Background -->
  <rect width="100%" height="100%" fill="#e0f7ff" />
  <!-- E-foil board -->
  <g id="efoil" transform="translate(150,130) scale(0.8)">
    <ellipse cx="0" cy="0" rx="80" ry="15" fill="#555" />
    <rect x="-75" y="-5" width="150" height="30" fill="#777" />
    <path d="M -70 -5 Q -60 -25 0 -35 Q 60 -25 70 -5" stroke="#555" stroke-width="2" fill="none" />
    <circle cx="0" cy="-30" r="8" fill="#ddd" />
    <line x1="0" y1="-30" x2="0" y2="-45" stroke="#555" stroke-width="2" />
    <circle cx="0" cy="-45" r="4" fill="#555" />
  </g>
  <!-- Penguin body -->
  <g id="penguin" transform="translate(150,100) scale(0.6)">
    <!-- Body -->
    <ellipse cx="0" cy="0" rx="40" ry="60" fill="black" />
    <ellipse cx="0" cy="-30" rx="30" ry="35" fill="white" />
    <!-- Eyes -->
    <circle cx="-10" cy="-35" r="5" fill="black" />
    <circle cx="10" cy="-35" r="5" fill="black" />
    <!-- Beak -->
    <polygon points="0,-30 -5,-20 5,-20" fill="orange" />
    <!-- Feet -->
    <path d="M -20 30 Q -15 45 -5 30" stroke="orange" stroke-width="6" fill="none" />
    <path d="M 20 30 Q 15 45 5 30" stroke="orange" stroke-width="6" fill="none" />
    <!-- Wings -->
    <path d="M -40 0 Q -60 -20 -40 -40" stroke="black" stroke-width="8" fill="none" />
    <path d="M 40 0 Q 60 -20 40 -40" stroke="black" stroke-width="8" fill="none" />
  </g>
  <!-- Sombrero -->
  <g id="sombrero" transform="translate(150,55) scale(0.5)">
    <path d="M -60 0 Q -50 -30 0 -35 Q 50 -30 60 0" fill="#b22222" stroke="#8b0000" stroke-width="2" />
    <rect x="-60" y="-5" width="120" height="10" fill="#8b0000" />
    <circle cx="0" cy="-30" r="12" fill="#ffdead" stroke="#8b0000" stroke-width="2" />
  </g>
</svg>
