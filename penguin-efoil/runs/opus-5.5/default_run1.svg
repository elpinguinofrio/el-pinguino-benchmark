<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8fd3ff"/><stop offset="1" stop-color="#e6f6ff"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a9fd6" stop-opacity="0.75"/><stop offset="1" stop-color="#0b4f7c" stop-opacity="0.92"/>
    </linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <circle cx="680" cy="80" r="42" fill="#ffd84a"/>

  <!-- underwater foil (drawn before the water so the water tints it) -->
  <g>
    <rect x="392" y="296" width="12" height="150" rx="3" fill="#2d2d33"/>           <!-- mast -->
    <rect x="320" y="440" width="190" height="12" rx="6" fill="#2d2d33"/>            <!-- fuselage -->
    <path d="M440 446 Q490 426 545 444 Q490 458 440 452 Z" fill="#3a3a44"/>          <!-- front wing -->
    <path d="M318 444 Q340 434 362 444 Q340 452 318 448 Z" fill="#3a3a44"/>          <!-- rear stabilizer -->
    <rect x="378" y="392" width="40" height="18" rx="9" fill="#55555f"/>             <!-- motor pod -->
    <ellipse cx="374" cy="401" rx="4" ry="16" fill="#9aa0aa"/>                       <!-- propeller -->
  </g>

  <!-- water -->
  <path d="M0 340 Q50 332 100 340 T200 340 T300 340 T400 340 T500 340 T600 340 T700 340 T800 340 V520 H0 Z" fill="url(#sea)"/>
  <path d="M0 340 Q50 332 100 340 T200 340 T300 340 T400 340 T500 340 T600 340 T700 340 T800 340" fill="none" stroke="#fff" stroke-width="3" opacity="0.7"/>
  <!-- wake where the mast cuts the surface -->
  <path d="M398 338 Q360 326 300 336 Q350 342 398 344 Z" fill="#fff" opacity="0.85"/>
  <path d="M300 336 Q250 330 200 338" stroke="#fff" stroke-width="3" fill="none" opacity="0.6"/>

  <!-- board flying above the water -->
  <path d="M250 286 H555 Q585 286 590 296 Q585 304 555 304 H260 Q245 304 245 295 Q245 286 250 286 Z" fill="#ff7a2f"/>
  <rect x="270" y="286" width="260" height="5" fill="#ffd2b0" opacity="0.6"/>

  <!-- penguin: feet on the board, knees bent, leaning forward into the ride -->
  <g transform="rotate(8 405 210)">
    <ellipse cx="380" cy="282" rx="18" ry="7" fill="#ff9f1c"/>                     <!-- back foot -->
    <ellipse cx="432" cy="282" rx="18" ry="7" fill="#ff9f1c"/>                     <!-- front foot -->
    <ellipse cx="405" cy="200" rx="52" ry="80" fill="#1e1e26"/>                     <!-- body -->
    <ellipse cx="415" cy="210" rx="34" ry="62" fill="#f7f7f2"/>                     <!-- belly -->
    <path d="M360 170 Q330 215 345 250 Q362 225 368 185 Z" fill="#14141a"/>         <!-- back flipper, out for balance -->
    <path d="M448 172 Q490 190 500 214 Q470 208 444 196 Z" fill="#14141a"/>         <!-- front flipper holding remote -->
    <rect x="494" y="204" width="20" height="12" rx="4" fill="#e63946"/>            <!-- hand remote -->
    <circle cx="420" cy="120" r="34" fill="#1e1e26"/>                               <!-- head -->
    <ellipse cx="432" cy="124" rx="18" ry="16" fill="#f7f7f2"/>                     <!-- face -->
    <circle cx="438" cy="118" r="4.5" fill="#111"/>
    <circle cx="439.5" cy="116.5" r="1.4" fill="#fff"/>
    <path d="M450 126 L474 131 L450 136 Z" fill="#ff9f1c"/>                         <!-- beak -->
    <!-- sombrero sitting on the head -->
    <ellipse cx="418" cy="94" rx="80" ry="15" fill="#e9b44c"/>
    <path d="M388 94 Q392 48 418 44 Q444 48 448 94 Z" fill="#f2c45a"/>
    <rect x="390" y="80" width="56" height="9" fill="#2a9d8f"/>
    <ellipse cx="418" cy="94" rx="80" ry="15" fill="none" stroke="#c4372d" stroke-width="4" stroke-dasharray="10 6"/>
  </g>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="120" y1="200" x2="220" y2="200"/>
    <line x1="90" y1="240" x2="210" y2="240"/>
    <line x1="140" y1="280" x2="230" y2="280"/>
  </g>
</svg>
